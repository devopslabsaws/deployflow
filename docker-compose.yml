services:
  # ─────────────────────────── Oracle XE ──────────────────────────────────────
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: deployflow-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD:       ${ORACLE_SYS_PASSWORD:-DeployFlow_Sys_2024}
      APP_USER:              DEPLOYFLOW
      APP_USER_PASSWORD:     ${ORACLE_APP_PASSWORD:-DeployFlow_2024!}
    volumes:
      - oracle_data:/opt/oracle/oradata
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 180s

  # ─────────────────────────── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deployflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_in_production} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────── Backend API ────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: src/DeployFlow.API/Dockerfile
    container_name: deployflow-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "User Id=DEPLOYFLOW;Password=${ORACLE_APP_PASSWORD:-DeployFlow_2024!};Data Source=oracle:1521/XEPDB1"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-changeme_in_production}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: deployflow
      Jwt__Audience: deployflow-users
      Jwt__ExpiryMinutes: "60"
      Encryption__Secret: ${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GitHub__FrontendUrl: ${GITHUB_FRONTEND_URL:-}
      GitHub__CallbackUrl: ${GITHUB_CALLBACK_URL:-}
      GitLab__CallbackUrl: ${GITLAB_CALLBACK_URL:-}
      Google__CallbackUrl: ${GOOGLE_CALLBACK_URL:-}
    ports:
      - "5000:8080"
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker-in-Docker for deploy engine
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────── Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        API_INTERNAL_URL: http://api:8080
    container_name: deployflow-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5000}
      # Internal URL the Next.js server uses to reach the API container
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────── Traefik (optional reverse proxy) ───────────────
  traefik:
    image: traefik:v3.1
    container_name: deployflow-traefik
    restart: unless-stopped
    profiles: ["proxy"]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt

  # ─────────────────────────── pgAdmin (dev only) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: deployflow-pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deployflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - oracle

volumes:
  oracle_data:
  redis_data:
  traefik_certs:
