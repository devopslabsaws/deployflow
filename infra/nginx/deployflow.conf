# DeployFlow — nginx reverse proxy
# Place at: /etc/nginx/sites-available/deployflow
# Symlink: sudo ln -s /etc/nginx/sites-available/deployflow /etc/nginx/sites-enabled/deployflow
# Remove default: sudo rm -f /etc/nginx/sites-enabled/default
# Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Frontend (Next.js) ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Backend API (direct) ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── SignalR WebSockets ────────────────────────────────────────────────────
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 86400;
    }
}
