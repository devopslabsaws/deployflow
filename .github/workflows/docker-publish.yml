name: Build & Push to Docker Hub

on:
  push:
    branches: [ "main" ]
    tags:    [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  # Change these to your Docker Hub username/repo names
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  API_IMAGE:          ${{ secrets.DOCKERHUB_USERNAME }}/deployflow-api
  FRONTEND_IMAGE:     ${{ secrets.DOCKERHUB_USERNAME }}/deployflow-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Set up Docker Buildx (multi-platform support) ──────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to Docker Hub ───────────────────────────────────────────────
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Derive image tags (latest + semver) ────────────────────────────────
      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for Frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Build & push Backend API ───────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          dockerfile: ./backend/src/DeployFlow.API/Dockerfile
          push:       ${{ github.event_name != 'pull_request' }}
          tags:       ${{ steps.meta-api.outputs.tags }}
          labels:     ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64

      # ── Build & push Frontend ──────────────────────────────────────────────
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          dockerfile: ./frontend/Dockerfile
          push:       ${{ github.event_name != 'pull_request' }}
          tags:       ${{ steps.meta-frontend.outputs.tags }}
          labels:     ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/proxy' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || '' }}

      # ── Print image digests ────────────────────────────────────────────────
      - name: Image digests
        if: github.event_name != 'pull_request'
        run: |
          echo "API:      ${{ steps.meta-api.outputs.tags }}"
          echo "Frontend: ${{ steps.meta-frontend.outputs.tags }}"
