services:
  # Branch-safe names and ports so multiple branches can run on one server.
  oracle:
    container_name: deployflow-${BRANCH_SLUG:-branch}-oracle
    ports: []

  redis:
    container_name: deployflow-${BRANCH_SLUG:-branch}-redis
    ports: []

  api:
    container_name: deployflow-${BRANCH_SLUG:-branch}-api
    environment:
      AllowedOrigins: ${ALLOWED_ORIGINS_OVERRIDE:-http://localhost:${FRONTEND_HOST_PORT:-3100}}
    ports:
      - "${API_HOST_PORT:-5100}:8080"

  frontend:
    container_name: deployflow-${BRANCH_SLUG:-branch}-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/proxy}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    ports:
      - "${FRONTEND_HOST_PORT:-3100}:3000"

  pgadmin:
    container_name: deployflow-${BRANCH_SLUG:-branch}-pgadmin
    ports: []
